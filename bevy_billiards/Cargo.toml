[package]
name = "bevy_billiards"
version = "0.1.0"
edition = "2021"
description = "3D Billiards visualization for VIVA NEAT training"
license = "MIT"

[dependencies]
# Bevy 0.15 with WebGPU support
bevy = { version = "0.15", features = ["wayland"] }

# Networking
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async channels for Bevy integration
crossbeam-channel = "0.5"

# Math utilities
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Enable dynamic linking for faster compile times during development
[features]
default = []
dynamic = ["bevy/dynamic_linking"]
